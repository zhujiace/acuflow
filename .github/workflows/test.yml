name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  medical:
    name: medical (AcuFlow regression)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Composite action installs Bun and runs `bun install`
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run AcuFlow medical regression tests
        working-directory: packages/core
        run: bun test test/medical.test.ts test/medical-scenario.test.ts
