name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    name: AcuFlow for Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Composite action installs Bun and runs `bun install`. windows-latest
      # ships the Visual Studio C++ toolchain needed to build the native deps.
      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      # Native Windows build. `windows.icon` in script/build.ts writes the
      # executable icon, and that is only possible when compiling on Windows.
      # `--skip-install` avoids the cross-platform @opentui/core reinstall.
      - name: Build AcuFlow for Windows
        working-directory: packages/opencode
        run: bun run build --single --skip-install

      # Keep the CI artifact for debugging.
      - name: Upload Windows x64 executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acuflow-windows-x64
          path: packages/opencode/dist/acuflow-windows-x64/bin/**
          if-no-files-found: error
          retention-days: 30

      # Publish the executable so clinicians can download it from the Releases
      # page. Tag pushes publish that tag; manual runs update a rolling
      # "latest" release so the download link stays stable.
      - name: Publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          ASSET="packages/opencode/dist/acuflow-windows-x64/bin/acuflow.exe"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "AcuFlow ${TAG}" --notes "AcuFlow 急腹症诊疗辅助系统（Windows x64 可执行文件）。下载 acuflow.exe 后双击或在该文件夹运行；首次运行若提示 Windows 已保护你的电脑，选择仍要运行；首次使用用 /connect 配置大模型 API Key。详见仓库 README。"
          fi
